name: Build Ampere Flight SQL image

on:
  push:
    branches: [main]
    paths:
      - docker/ampere-flight-sql/**
      - .github/workflows/build-flight-sql-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/ampere-flight-sql
          push: true
          platforms: linux/amd64
          tags: ghcr.io/antonminiazev/ampere-flight-sql:v0.1.2
          cache-from: type=gha
          cache-to: type=gha,mode=max
