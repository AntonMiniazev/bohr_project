apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-dags-source-script
data:
  sync.sh: |-
    #!/bin/sh
    set -eu
    apk add --no-cache git coreutils
    while :; do
      rm -rf /scratch/source
      git clone --quiet --depth 1 --single-branch --branch "$PRODUCTION_BRANCH" "$REPOSITORY" /scratch/source
      source_revision="$(git -C /scratch/source rev-parse --short=12 HEAD)"
      revision="${source_revision}-main1"
      target="/dags/releases/${revision}"
      staging="/dags/releases/.${revision}.pending"
      if [ ! -d "$target" ]; then
        rm -rf "$staging"
        mkdir -p "$staging"
        cp -a /scratch/source/dags/. "$staging/"
        mv -T "$staging" "$target"
      fi
      rm -f /dags/current.next
      ln -s "releases/${revision}" /dags/current.next
      mv -Tf /dags/current.next /dags/current
      echo "Published Airflow DAG revision ${source_revision}"
      rm -rf /scratch/source
      sleep "$SYNC_INTERVAL_SECONDS"
    done
