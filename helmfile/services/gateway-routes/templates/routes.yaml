{{- $gateway := .Values.gateway -}}
{{- range $name := list "airflow" "minioConsole" "minioS3" "grafana" "lakekeeper" }}
{{- $route := index $.Values.routes $name }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name | kebabcase }}
  namespace: {{ $route.namespace }}
spec:
  hostnames:
    - {{ $route.host | quote }}
  parentRefs:
    - name: {{ $gateway.name }}
      namespace: {{ $gateway.namespace }}
      sectionName: {{ $gateway.httpsSectionName }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $route.service }}
          port: {{ $route.port }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unity-catalog
  namespace: {{ .Values.routes.unityCatalog.namespace }}
spec:
  hostnames:
    - {{ .Values.routes.unityCatalog.host | quote }}
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.httpsSectionName }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ .Values.routes.unityCatalog.service }}
          port: {{ .Values.routes.unityCatalog.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.routes.unityCatalog.uiService }}
          port: {{ .Values.routes.unityCatalog.uiPort }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: spark-connect
  namespace: {{ .Values.routes.sparkConnect.namespace }}
spec:
  hostnames:
    - {{ .Values.routes.sparkConnect.host | quote }}
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.httpsSectionName }}
  rules:
    - backendRefs:
        - name: {{ .Values.routes.sparkConnect.service }}
          port: {{ .Values.routes.sparkConnect.port }}
