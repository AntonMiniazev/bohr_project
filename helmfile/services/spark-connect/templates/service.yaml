{{- if .Values.sparkConnect.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: spark-connect
  {{- if .Values.sparkConnect.tailscale.expose }}
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: {{ .Values.sparkConnect.tailscale.hostname | quote }}
    tailscale.com/tags: "tag:spark-connect"
  {{- end }}
  labels:
    app: spark-connect
spec:
  type: ClusterIP
  selector:
    app: spark-connect
  ports:
    - name: grpc
      port: {{ .Values.sparkConnect.service.port }}
      targetPort: grpc
{{- end }}
