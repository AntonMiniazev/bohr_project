{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ampere-flight-sql-config
data:
  FLIGHT_SQL_PORT: {{ .Values.service.flightSqlPort | quote }}
  HEALTH_PORT: {{ .Values.service.healthPort | quote }}
  DUCKDB_THREADS: {{ .Values.duckdbThreads | quote }}
  MAX_CONCURRENT_QUERIES: {{ .Values.maxConcurrentQueries | quote }}
  DUCKDB_MEMORY_LIMIT: {{ .Values.duckdbMemoryLimit | quote }}
  MINIO_S3_ENDPOINT: {{ .Values.minioEndpoint | quote }}
  LAKEKEEPER_CATALOG_URI: {{ .Values.catalogUri | quote }}
  LAKEKEEPER_OAUTH_URI: {{ .Values.oauthUri | quote }}
  LAKEKEEPER_SCOPE: {{ .Values.oauthScope | quote }}
  ICEBERG_GOLD_WAREHOUSE: {{ .Values.warehouse | quote }}
{{- end }}
