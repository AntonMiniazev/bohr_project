global:
  projectName: PROJECT_NAME
  namespace: NAMESPACE
  storageClass: STORAGECLASS_PROVIDER
  kubeVersion: KUBE_VERSION
networking:
  ciliumCidr: CILIUM_CIDR
  masterIp: MASTER_NODE_IP
nodes:
  postgresql: POSTGRES_NODE_IP
  minio: MINIO_NODE_IP
  airflow: AIRFLOW_NODE_IP
monitoring:
  namespace: monitoring
  node: MONITORING_NODE
infra:
  node: INFRA_NODE
spark:
  node: SPARK_NODE
  jobNamespaces:
    - NAMESPACE
sparkConnect:
  enabled: true
  node: SPARK_NODE
  image:
    repository: spark
    tag: "4.1.1-python3"
    pullPolicy: IfNotPresent
  service:
    port: 15002
  minio:
    endpoint: "http://minio.NAMESPACE.svc.cluster.local:9000"
    region: us-east-1
    pathStyle: true
    ssl: false
    secretName: minio-creds
    buckets:
      - ampere-raw
      - ampere-iceberg-bronze
      - ampere-iceberg-silver
      - ampere-iceberg-gold
  ivy:
    enabled: true
    mountPath: /opt/spark/ivy
  resources:
    requests:
      cpu: "1"
      memory: 5Gi
    limits:
      cpu: "2"
      memory: 8Gi

ivyCache:
  name: IVY_CACHE_NAME
  size: 10Gi
  storageClass: ivy-cache-rwx
  accessMode: ReadWriteMany
  mountPath: /opt/spark/ivy
  node: ""
  loader:
    enabled: true
    image: busybox:1.36
  bootstrap:
    enabled: true
    image: curlimages/curl:8.7.1
    ttlSecondsAfterFinished: 600
    urls:
      - https://repo1.maven.org/maven2/software/amazon/awssdk/bundle/2.35.4/bundle-2.35.4.jar
      - https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.4.1/hadoop-aws-3.4.1.jar
      - https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.3/postgresql-42.7.3.jar
      - https://repo.maven.apache.org/maven2/org/apache/iceberg/iceberg-spark-runtime-4.1_2.13/1.12.0/iceberg-spark-runtime-4.1_2.13-1.12.0.jar

ivyCacheNfs:
  enabled: true
  size: 10Gi
  storageClass: ivy-cache-rwx
  backingStorageClass: STORAGECLASS_PROVIDER
  node: INFRA_NODE

airflow:
  gitRepo: DAG_REPOSITORY_URL
  host: "https://airflow.local"
  node: AIRFLOW_NODE
  workerServiceAccount: AIRFLOW_WORKER_SERVICE_ACCOUNT
  image:
    repository: apache/airflow
    tag: 3.3.2-python3.12
    pullPolicy: IfNotPresent

minio:
  node: MINIO_NODE
  release: RELEASE.2025-09-07T16-13-09Z-cpuv1
  s3_endpoint: "s3.minio.local"
  server_url: "https://s3.minio.local"
  repo: ghcr.io/antonminiazev/bohr-minio

postgresql:
  host: postgres-service
  port: 5432
  service:
    type: NodePort
    nodePort: 32433
  node: POSTGRES_NODE
  image:
    repository: postgres
    tag: 16
    pullPolicy: IfNotPresent
  airflowUser: airflow_user
  airflowDatabase: airflow_db
  operationalUser: OPERATIONAL_USER
  operationalDatabase: OPERATIONAL_DB
  tls:
    enabled: false
    secretName: postgresql-tls
  access:
    allowedCidrs:
      - CLUSTER_POD_CIDR
      - LAN_CIDR
      - TAILSCALE_CIDR

externalSecrets:
  secretName: azure-kv-sp
  storeName: azure-kv

lakekeeper:
  auth:
    enabled: false
    tenantId: ENTRA_TENANT_ID
    uiClientId: ""
    apiClientId: ""

gateway:
  namespace: ampere-gateway
  name: ampere-gateway
  className: cilium
  listeners:
    httpPort: 30081
    httpsPort: 30444
  hosts:
    airflow: airflow.local
    minio: minio.local
    minioS3: s3.minio.local
    grafana: grafana.local
    sparkconnect: sparkconnect.local
    lakekeeper: lakekeeper.local
  tls:
    caIssuerName: local-ca
    caSecretName: local-ca
    sharedSecret: ampere-tls
    bootstrap:
      enabled: false
