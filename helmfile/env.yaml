global:
  projectName: ampere
  namespace: ampere
  storageClass: local-path
  kubeVersion: "1.36"
networking:
  ciliumCidr: 10.10.0.0/16
  masterIp: 192.168.11.100
nodes:
  postgresql: 192.168.11.101
  minio: 192.168.11.102
  airflow: 192.168.11.103
monitoring:
  namespace: monitoring
  node: ampere-k8s-node2
infra:
  node: ampere-k8s-node4
spark:
  node: ampere-k8s-node4
  jobNamespaces:
    - ampere
sparkConnect:
  enabled: true
  node: ampere-k8s-node4
  image:
    repository: spark
    tag: "4.1.1-python3"
    pullPolicy: IfNotPresent
  service:
    port: 15002
  minio:
    endpoint: "http://minio.ampere.svc.cluster.local:9000"
    region: us-east-1
    pathStyle: true
    ssl: false
    secretName: minio-creds
    buckets:
      - ampere-raw
      - ampere-iceberg-bronze
      - ampere-iceberg-silver
      - ampere-iceberg-gold
  ivy:
    enabled: true
    mountPath: /opt/spark/ivy
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 8Gi

flightSql:
  enabled: true
  dedicatedCredentials: true
  node: ampere-k8s-node4
  image:
    repository: ghcr.io/antonminiazev/ampere-flight-sql
    tag: v0.1.1
    pullPolicy: IfNotPresent
  service:
    flightSqlPort: 8815
    healthPort: 8080
  tailscale:
    expose: true
    hostname: ampere-flight-sql
  minioEndpoint: http://minio.ampere.svc.cluster.local:9000
  duckdbThreads: 2
  maxConcurrentQueries: 1
  duckdbMemoryLimit: 3GB
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 8Gi

ivyCache:
  name: ivy-cache
  size: 10Gi
  storageClass: ivy-cache-rwx
  accessMode: ReadWriteMany
  mountPath: /opt/spark/ivy
  node: ""
  loader:
    enabled: true
    image: busybox:1.36
  bootstrap:
    enabled: true
    image: curlimages/curl:8.7.1
    ttlSecondsAfterFinished: 600
    urls:
      - https://repo1.maven.org/maven2/software/amazon/awssdk/bundle/2.35.4/bundle-2.35.4.jar
      - https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.4.1/hadoop-aws-3.4.1.jar
      - https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.3/postgresql-42.7.3.jar
      - https://repo.maven.apache.org/maven2/org/apache/iceberg/iceberg-spark-runtime-4.1_2.13/1.12.0/iceberg-spark-runtime-4.1_2.13-1.12.0.jar

ivyCacheNfs:
  enabled: true
  size: 10Gi
  storageClass: ivy-cache-rwx
  backingStorageClass: local-path
  node: ampere-k8s-node2

airflow:
  gitRepo: https://github.com/AntonMiniazev/ampere_project.git
  host: "https://airflow.local"
  node: ampere-k8s-node3
  workerServiceAccount: airflow-worker
  image:
    repository: apache/airflow
    tag: 3.3.2-python3.12
    pullPolicy: IfNotPresent

minio:
  node: ampere-k8s-node2
  release: "RELEASE.2025-09-07T16-13-09Z-cpuv1"
  s3_endpoint: "s3.minio.local"
  server_url: "http://minio.ampere.svc.cluster.local:9000"
  repo: ghcr.io/antonminiazev/bohr-minio

postgresql:
  host: postgres-service
  port: 5432
  service:
    type: NodePort
    nodePort: 32433
  node: ampere-k8s-node1
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  airflowUser: airflow_user
  airflowDatabase: airflow_db
  operationalUser: ampere_user
  operationalDatabase: ampere_db
  sourceSchema: source
  tls:
    enabled: false
    secretName: postgresql-tls
  access:
    allowedCidrs:
      - 10.10.0.0/16
      - 192.168.0.0/16
      - 100.64.0.0/10

externalSecrets:
  secretName: azure-kv-sp
  storeName: azure-kv

lakekeeper:
  auth:
    enabled: true
    tenantId: 2ffd8fbf-1421-46ed-9e6b-021c955dbe34
    uiClientId: d8eb4b7a-6859-4f45-914f-5446f8600863
    apiClientId: 4120baf5-d479-464e-8c83-a96b5d475fdf

gateway:
  namespace: ampere-gateway
  name: ampere-gateway
  className: cilium
  listeners:
    httpPort: 30081
    httpsPort: 30444
  hosts:
    airflow: airflow.local
    minio: minio.local
    minioS3: s3.minio.local
    grafana: grafana.local
    sparkconnect: sparkconnect.local
    lakekeeper: lakekeeper.local
  tls:
    caIssuerName: local-ca
    caSecretName: local-ca
    sharedSecret: ampere-tls
    bootstrap:
      enabled: false
