global:
  projectName: ampere
  namespace: ampere
  storageClass: local-path
  kubeVersion: "1.36"
networking:
  ciliumCidr: 10.10.0.0/16
  masterIp: 192.168.11.100
nodes:
  postgresql: 192.168.11.101
  minio: 192.168.11.102
  airflow: 192.168.11.103
monitoring:
  namespace: monitoring
  node: ampere-k8s-node2
infra:
  node: ampere-k8s-node4
spark:
  node: ampere-k8s-node4
  jobNamespaces:
    - ampere
sparkConnect:
  enabled: true
  node: ampere-k8s-node4
  image:
    repository: spark
    tag: "4.1.1-python3"
    pullPolicy: IfNotPresent
  service:
    port: 15002
  minio:
    endpoint: "http://minio.ampere.svc.cluster.local:9000"
    region: us-east-1
    pathStyle: true
    ssl: false
    secretName: minio-creds
  ivy:
    enabled: true
    mountPath: /opt/spark/ivy
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 8Gi

unityCatalog:
  enabled: true
  namespace: unity-catalog
  node: ampere-k8s-node4
  apiToken: local-dev-token
  image:
    server:
      repository: unitycatalog/unitycatalog
      tag: v0.6.0
      pullPolicy: IfNotPresent
    ui:
      repository: unitycatalog/unitycatalog-ui
      tag: main
      pullPolicy: IfNotPresent
  database:
    host: postgres-service
    port: 5432
    name: unity_catalog
    user: unity_catalog_user
    hbm2ddlAuto: update
    passwordSecretName: uc-postgres
    passwordSecretKey: password
    ssl:
      enabled: false
      mode: verify-full
  storage:
    modelRoot: s3://ampere-bronze
    sessionToken: local-dev-token
    tableRoot: s3://ampere-gold-ops/uc-managed-pilot
    bucketPaths:
      - s3://ampere-gold
      - s3://ampere-gold-ops
      - s3://ampere-silver
      - s3://ampere-silver-ops
      - s3://ampere-bronze
      - s3://ampere-raw
    region: us-east-1
    credentialsSecretName: uc-minio
  resources:
    server:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1536Mi
    ui:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        cpu: 750m
        memory: 2Gi
ivyCache:
  name: ivy-cache
  size: 10Gi
  storageClass: ivy-cache-rwx
  accessMode: ReadWriteMany
  mountPath: /opt/spark/ivy
  node: ""
  loader:
    enabled: true
    image: busybox:1.36
  bootstrap:
    enabled: true
    image: curlimages/curl:8.7.1
    ttlSecondsAfterFinished: 600
    urls:
      - https://repo1.maven.org/maven2/software/amazon/awssdk/bundle/2.24.6/bundle-2.24.6.jar
      - https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.4.1/hadoop-aws-3.4.1.jar
      - https://repo1.maven.org/maven2/io/delta/delta-spark_2.13/4.2.0/delta-spark_2.13-4.2.0.jar
      - https://repo1.maven.org/maven2/io/delta/delta-storage/4.2.0/delta-storage-4.2.0.jar
      - https://repo1.maven.org/maven2/io/unitycatalog/unitycatalog-spark_2.13/0.4.1/unitycatalog-spark_2.13-0.4.1.jar
      - https://repo1.maven.org/maven2/io/unitycatalog/unitycatalog-client/0.4.1/unitycatalog-client-0.4.1.jar
      - https://repo1.maven.org/maven2/software/amazon/awssdk/bundle/2.35.4/bundle-2.35.4.jar
      - https://repo1.maven.org/maven2/io/unitycatalog/unitycatalog-spark_2.13/0.3.1/unitycatalog-spark_2.13-0.3.1.jar
      - https://repo1.maven.org/maven2/io/unitycatalog/unitycatalog-client/0.3.1/unitycatalog-client-0.3.1.jar
      - https://repo1.maven.org/maven2/software/amazon/awssdk/bundle/2.29.52/bundle-2.29.52.jar
      - https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.3/postgresql-42.7.3.jar
      - https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.4.2/hadoop-aws-3.4.2.jar
      - https://repo1.maven.org/maven2/io/delta/delta-spark_4.1_2.13/4.4.0/delta-spark_4.1_2.13-4.4.0.jar
      - https://repo1.maven.org/maven2/io/delta/delta-storage/4.4.0/delta-storage-4.4.0.jar
      - https://repo1.maven.org/maven2/io/unitycatalog/unitycatalog-spark_4.1_2.13/0.6.0/unitycatalog-spark_4.1_2.13-0.6.0.jar
      - https://repo1.maven.org/maven2/io/unitycatalog/unitycatalog-client/0.6.0/unitycatalog-client-0.6.0.jar
      - https://repo1.maven.org/maven2/io/unitycatalog/unitycatalog-hadoop/0.6.0/unitycatalog-hadoop-0.6.0.jar

ivyCacheNfs:
  enabled: true
  size: 10Gi
  storageClass: ivy-cache-rwx
  backingStorageClass: local-path
  node: ampere-k8s-node2

airflow:
  gitRepo: https://github.com/AntonMiniazev/ampere_project.git
  host: "https://airflow.local"
  node: ampere-k8s-node3
  workerServiceAccount: airflow-worker
  image:
    repository: apache/airflow
    tag: 3.3.2-python3.12
    pullPolicy: IfNotPresent

minio:
  node: ampere-k8s-node2
  release: "RELEASE.2025-09-07T16-13-09Z-cpuv1"
  s3_endpoint: "s3.minio.local"
  server_url: "http://minio.ampere.svc.cluster.local:9000"
  repo: quay.io/minio/minio

postgresql:
  host: postgres-service
  port: 5432
  service:
    type: NodePort
    nodePort: 32433
  node: ampere-k8s-node1
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  airflowUser: airflow_user
  airflowDatabase: airflow_db
  operationalUser: ampere_user
  operationalDatabase: ampere_db
  sourceSchema: source
  tls:
    enabled: false
    secretName: postgresql-tls
  access:
    allowedCidrs:
      - 10.10.0.0/16
      - 192.168.0.0/16
      - 100.64.0.0/10

externalSecrets:
  secretName: azure-kv-sp
  storeName: azure-kv

lakekeeper:
  auth:
    enabled: true
    tenantId: 2ffd8fbf-1421-46ed-9e6b-021c955dbe34
    uiClientId: d8eb4b7a-6859-4f45-914f-5446f8600863
    apiClientId: 4120baf5-d479-464e-8c83-a96b5d475fdf

gateway:
  namespace: ampere-gateway
  name: ampere-gateway
  className: cilium
  listeners:
    httpPort: 30081
    httpsPort: 30444
  hosts:
    airflow: airflow.local
    minio: minio.local
    minioS3: s3.minio.local
    grafana: grafana.local
    sparkconnect: sparkconnect.local
    ucatalog: ucatalog.local
    lakekeeper: lakekeeper.local
  tls:
    caIssuerName: local-ca
    caSecretName: local-ca
    sharedSecret: ampere-tls
    bootstrap:
      enabled: false
